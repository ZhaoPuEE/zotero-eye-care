<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Zotero Eye Care</title>
  <desc id="desc">A calm reading surface with four eye-care color palettes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF5EB"/>
      <stop offset="0.5" stop-color="#F7F0DE"/>
      <stop offset="1" stop-color="#E8EFF4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
